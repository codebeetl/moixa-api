[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moixa-py"
version = "0.1.0"
description = "Unofficial Python client for the Moixa GridShare API inferred from APK analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0", "pycognito", "aws-requests-auth", "boto3"]
authors = [{name = "Perplexity"}]

[project.scripts]
moixa = "moixa_py.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["moixa_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
